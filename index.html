<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>重定向到Flask服务器</title>
    <script>
        // 自动重定向到Flask服务器
        window.location.href = 'http://localhost:5000' + window.location.pathname;
    </script>
</head>
<body>
    <h1>正在重定向到Flask服务器...</h1>
    <p>如果页面没有自动跳转，请点击 <a href="http://localhost:5000/staff/login">这里</a></p>
</body>
</html>
