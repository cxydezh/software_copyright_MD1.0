<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码重置</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #dc3545;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }
        .content {
            background-color: #f8f9fa;
            padding: 30px;
            border-radius: 0 0 5px 5px;
        }
        .button {
            display: inline-block;
            background-color: #dc3545;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
        }
        .button:hover {
            background-color: #c82333;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }
        .warning {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{ app_name }}</h1>
    </div>
    
    <div class="content">
        <h2>密码重置</h2>
        <p>亲爱的 {{ user.name }}，</p>
        
        <p>我们收到了您的密码重置请求。请点击下面的按钮重置您的密码：</p>
        
        <div style="text-align: center;">
            <a href="{{ reset_url }}" class="button">重置密码</a>
        </div>
        
        <p>如果按钮无法点击，请复制以下链接到浏览器中打开：</p>
        <p style="word-break: break-all; background-color: #e9ecef; padding: 10px; border-radius: 3px;">
            {{ reset_url }}
        </p>
        
        <div class="warning">
            <strong>安全提醒：</strong>
            <ul>
                <li>此链接将在1小时后过期</li>
                <li>如果您没有请求重置密码，请忽略此邮件</li>
                <li>为了账户安全，请定期更换密码</li>
            </ul>
        </div>
        
        <p>如果您没有请求密码重置，请立即联系我们的客服团队。</p>
    </div>
    
    <div class="footer">
        <p>此邮件由系统自动发送，请勿回复。</p>
        <p>&copy; 2024 {{ app_name }}. 保留所有权利。</p>
    </div>
</body>
</html>
