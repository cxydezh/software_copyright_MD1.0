<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎注册</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #28a745;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }
        .content {
            background-color: #f8f9fa;
            padding: 30px;
            border-radius: 0 0 5px 5px;
        }
        .button {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
        }
        .button:hover {
            background-color: #218838;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }
        .features {
            background-color: #e7f3ff;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>欢迎使用 {{ app_name }}</h1>
    </div>
    
    <div class="content">
        <h2>注册成功！</h2>
        <p>亲爱的 {{ user.name }}，</p>
        
        <p>恭喜您成功注册 {{ app_name }}！我们很高兴为您提供服务。</p>
        
        <div class="features">
            <h3>系统功能特色：</h3>
            <ul>
                <li>📝 在线申请软件著作权</li>
                <li>📊 实时查看申请进度</li>
                <li>💬 与工作人员在线沟通</li>
                <li>📁 文件上传和管理</li>
                <li>📧 邮件通知提醒</li>
            </ul>
        </div>
        
        <div style="text-align: center;">
            <a href="{{ app_url }}/auth/login" class="button">立即登录</a>
        </div>
        
        <p>如果您有任何问题或需要帮助，请随时联系我们的客服团队。</p>
        
        <p>再次感谢您选择我们的服务！</p>
    </div>
    
    <div class="footer">
        <p>此邮件由系统自动发送，请勿回复。</p>
        <p>&copy; 2024 {{ app_name }}. 保留所有权利。</p>
    </div>
</body>
</html>
